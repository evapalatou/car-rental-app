{% extends "base.html" %}
{% load i18n %}

{% block title %}Sign Out | Elite Rides{% endblock %}

{% block content %}

<div class="signup-background">
    {% include "includes/home_content.html" %}
</div>

<div class="signup-overlay">

    <section class="signup-panel">

        <a href="{% url 'home' %}"
           class="signup-close"
           aria-label="Close sign out">
            &times;
        </a>

        <div class="signup-content">

            <div class="signup-heading">
                <h2>Sign out</h2>
                <p>Are you sure you want to sign out of Elite Rides?</p>
            </div>

            <form method="post" action="{% url 'account_logout' %}">
                {% csrf_token %}

                <button type="submit"
                        class="button button-primary signup-submit">
                    Sign Out
                </button>
            </form>

        </div>

    </section>

</div>

{% endblock %}
